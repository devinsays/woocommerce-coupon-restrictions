name: PHPUnit Tests

on: [push]

jobs:
  test:
    strategy:
      matrix:
        php_ver:
          - "8.3"
          - "8.4"
        wp_ver:
          - "latest"
        wc_ver:
          - "latest"
          - "9.4.0"

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout the files
        uses: actions/checkout@v3

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_ver }}
          tools: phpunit

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php_ver }}
          version: 2

      # The runner image no longer ships MySQL. The service above provides it and
      # creates the database, so database creation is skipped (last arg).
      - name: Run install-wp-tests.sh
        run: sudo ./tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp_ver }} true

      - name: Run install-woocommerce.sh
        run: sudo ./tests/bin/install-woocommerce.sh ${{ matrix.wc_ver }}

      - name: Run phpunit
        run: ./vendor/bin/phpunit -c phpunit.xml
        env:
          WC_VERSION: ${{ matrix.wc_ver }}
